<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeTube MSE Backend Test</title>

    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 12px 20px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #startButton {
            background: #ff0033;
            color: white;
        }

        #clearButton {
            background: #333;
            color: white;
        }

        video {
            display: block;
            width: min(100%, 960px);
            margin-top: 20px;
            background: black;
        }

        #status {
            margin-top: 20px;
            padding: 16px;
            background: #1d1d1d;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 500px;
            overflow-y: auto;
        }

        .success {
            color: #55ff77;
        }

        .error {
            color: #ff5555;
        }
    </style>
</head>

<body>

    <h1>CodeTube MSE Backend Test</h1>

    <button id="startButton">
        Start Video Test
    </button>

    <button id="clearButton">
        Clear Log
    </button>

    <video
        id="player"
        controls
        playsinline>
    </video>

    <div id="status">Ready.</div>

    <script>

        const BACKEND =
            "https://codetube-backend.vercel.app";

        const VIDEO_ID =
            "dQw4w9WgXcQ";

        const player =
            document.getElementById("player");

        const status =
            document.getElementById("status");


        let mediaSource = null;
        let videoSourceBuffer = null;
        let audioSourceBuffer = null;


        function log(message) {

            status.textContent +=
                "\n" + message;

            status.scrollTop =
                status.scrollHeight;

        }


        function clearLog() {

            status.textContent =
                "Ready.";

        }


        async function getFile(filename) {

            const url =
                BACKEND +
                "/api/cache-file?id=" +
                encodeURIComponent(VIDEO_ID) +
                "&file=" +
                encodeURIComponent(filename);


            log(
                "Downloading: " +
                filename
            );


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    " for " +
                    filename
                );

            }


            const data =
                await response.arrayBuffer();


            log(
                "Downloaded " +
                filename +
                " (" +
                data.byteLength +
                " bytes)"
            );


            return data;

        }


        async function getManifest() {

            const url =
                BACKEND +
                "/api/cache-file?id=" +
                encodeURIComponent(VIDEO_ID) +
                "&file=manifest.json";


            log(
                "Loading manifest..."
            );


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Manifest HTTP " +
                    response.status
                );

            }


            const manifest =
                await response.json();


            log(
                "Manifest loaded."
            );


            log(
                "Title: " +
                manifest.title
            );


            log(
                "Resolution: " +
                manifest.width +
                "x" +
                manifest.height
            );


            log(
                "Video segments: " +
                manifest.videoSegments.length
            );


            log(
                "Audio segments: " +
                manifest.audioSegments.length
            );


            return manifest;

        }


        function appendBuffer(
            sourceBuffer,
            data
        ) {

            return new Promise(
                function(resolve, reject) {

                    function done() {

                        sourceBuffer
                            .removeEventListener(
                                "updateend",
                                done
                            );

                        sourceBuffer
                            .removeEventListener(
                                "error",
                                failed
                            );

                        resolve();

                    }


                    function failed(event) {

                        sourceBuffer
                            .removeEventListener(
                                "updateend",
                                done
                            );

                        sourceBuffer
                            .removeEventListener(
                                "error",
                                failed
                            );

                        reject(
                            event
                        );

                    }


                    sourceBuffer
                        .addEventListener(
                            "updateend",
                            done
                        );

                    sourceBuffer
                        .addEventListener(
                            "error",
                            failed
                        );


                    sourceBuffer.appendBuffer(
                        data
                    );

                }
            );

        }


        async function startTest() {

            clearLog();

            log(
                "Starting CodeTube MSE test..."
            );


            if (!window.MediaSource) {

                throw new Error(
                    "MediaSource is not supported."
                );

            }


            const manifest =
                await getManifest();


            const videoMime =
                'video/mp4; codecs="' +
                manifest.videoCodec +
                '"';


            const audioMime =
                'audio/mp4; codecs="' +
                manifest.audioCodec +
                '"';


            log(
                "Video MIME: " +
                videoMime
            );


            log(
                "Audio MIME: " +
                audioMime
            );


            if (
                !MediaSource.isTypeSupported(
                    videoMime
                )
            ) {

                throw new Error(
                    "Video MIME is not supported."
                );

            }


            if (
                !MediaSource.isTypeSupported(
                    audioMime
                )
            ) {

                throw new Error(
                    "Audio MIME is not supported."
                );

            }


            log(
                "MIME support confirmed."
            );


            mediaSource =
                new MediaSource();


            player.src =
                URL.createObjectURL(
                    mediaSource
                );


            await new Promise(
                function(resolve, reject) {

                    mediaSource.addEventListener(
                        "sourceopen",
                        resolve,
                        {
                            once: true
                        }
                    );

                    mediaSource.addEventListener(
                        "error",
                        reject,
                        {
                            once: true
                        }
                    );

                }
            );


            log(
                "MediaSource opened."
            );


            videoSourceBuffer =
                mediaSource.addSourceBuffer(
                    videoMime
                );


            audioSourceBuffer =
                mediaSource.addSourceBuffer(
                    audioMime
                );


            log(
                "Video SourceBuffer created."
            );


            log(
                "Audio SourceBuffer created."
            );


            const videoInit =
                await getFile(
                    manifest.videoInit.filename
                );


            const audioInit =
                await getFile(
                    manifest.audioInit.filename
                );


            await appendBuffer(
                videoSourceBuffer,
                videoInit
            );


            log(
                "Video init appended."
            );


            await appendBuffer(
                audioSourceBuffer,
                audioInit
            );


            log(
                "Audio init appended."
            );


            log(
                "Starting progressive download..."
            );


            let playbackStarted =
                false;


            const startPlayback =
                async function() {

                    if (playbackStarted) {
                        return;
                    }


                    try {

                        await player.play();

                        playbackStarted =
                            true;

                        log(
                            "PLAYBACK STARTED."
                        );

                    } catch (error) {

                        log(
                            "Autoplay blocked. Press play."
                        );

                    }

                };


            for (
                let i = 0;
                i < Math.max(
                    manifest.videoSegments.length,
                    manifest.audioSegments.length
                );
                i++
            ) {

                if (
                    i <
                    manifest.videoSegments.length
                ) {

                    const segment =
                        manifest.videoSegments[i];


                    const data =
                        await getFile(
                            segment.filename
                        );


                    await appendBuffer(
                        videoSourceBuffer,
                        data
                    );


                    log(
                        "Video chunk " +
                        segment.index +
                        " appended."
                    );

                }


                if (
                    i <
                    manifest.audioSegments.length
                ) {

                    const segment =
                        manifest.audioSegments[i];


                    const data =
                        await getFile(
                            segment.filename
                        );


                    await appendBuffer(
                        audioSourceBuffer,
                        data
                    );


                    log(
                        "Audio chunk " +
                        segment.index +
                        " appended."
                    );

                }


                if (
                    !playbackStarted &&
                    player.buffered.length > 0 &&
                    player.buffered.end(0) > 4
                ) {

                    await startPlayback();

                }

            }


            if (
                mediaSource.readyState ===
                "open"
            ) {

                mediaSource.endOfStream();

            }


            log(
                "All cached segments loaded."
            );


            log(
                "🎉 CODETUBE MSE TEST COMPLETE"
            );

        }


        document
            .getElementById("startButton")
            .addEventListener(
                "click",
                async function() {

                    try {

                        await startTest();

                    } catch (error) {

                        log(
                            "💥 TEST FAILED"
                        );

                        log(
                            error.message ||
                            String(error)
                        );

                        console.error(
                            error
                        );

                    }

                }
            );


        document
            .getElementById("clearButton")
            .addEventListener(
                "click",
                clearLog
            );

    </script>

</body>
</html>
